name: format

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Bug-class rules only. The annotation (ANN) and docstring (D) rules in
      # ruff.toml are not gated yet.
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check --select E4,E7,E9,F,B,Q"
